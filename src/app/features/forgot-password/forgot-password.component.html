<div class="flex min-h-screen bg-mainBg overflow-hidden">
  <a
    routerLink="/home"
    class="hidden lg:flex lg:w-1/2 relative bg-cover bg-center cursor-pointer hover:opacity-95 transition-opacity"
    style="background-image: url('./img/Forgot-Password.png')"
  >
    <div class="absolute inset-0 bg-black/20"></div>
    <div class="relative z-10 flex items-end p-10 xl:p-16 w-full">
      <h1 class="text-3xl xl:text-4xl font-bold text-white mb-4 leading-tight drop-shadow-lg">
        Focus on your ideas,<br />we'll handle the<br />access.
        <div class="w-12 h-1 bg-white mt-4 opacity-70"></div>
      </h1>
    </div>
  </a>

  <div class="w-full lg:w-1/2 flex flex-col items-center justify-center p-4 lg:p-8 overflow-y-auto">
    <a
      routerLink="/home"
      class="w-full sm:w-auto bg-gray-100 mb-2.5 hover:bg-gray-200 text-mainColorDark font-bold py-3.5 px-8 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2.5 text-sm border border-gray-200/50"
    >
      Return Home <i class="fa-solid fa-house text-xs"></i>
    </a>
    <div class="w-full max-w-sm xl:max-w-md my-auto">
      <div class="w-full max-w-sm xl:max-w-md my-auto">
        <div class="mb-5">
          <h1 class="flex items-center gap-2 mb-2 text-mainColorDark font-bold text-lg">
            <img src="./img/Logo-Misa7a-icon.png" class="w-5.5 h-5.5" alt="logo-Misa7a" />
            <span>Misa7a Workspace</span>
          </h1>
          <div class="mb-6">
            <h2 class="text-2xl xl:text-3xl font-bold text-gray-900 mb-2">Reset Password</h2>
            <p class="text-sm text-fontGray2">
              Enter your registered email address and we'll send you a link to reset your password.
            </p>
          </div>

          <form>
            <div class="mb-5">
              <label class="block mb-1 text-2xs font-bold text-linksColor1 tracking-wider uppercase"
                >Email Address</label
              >
              <input
                type="email"
                class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-mainColorLight focus:border-mainColorLight block w-full p-2 shadow-sm"
                placeholder="e.g. name@Misa7a.com"
                required
              />
            </div>

            <button
              type="submit"
              class="w-full text-white bg-mainColorLight hover:bg-mainColorDark focus:ring-2 focus:outline-none focus:ring-mainExtraLight font-medium rounded-lg text-sm px-5 py-2 text-center transition-colors flex justify-center items-center gap-2 mb-5 cursor-pointer"
            >
              Send Reset Link <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>

            <div class="text-center">
              <a
                routerLink="/login"
                class="text-xs font-bold text-mainColorDark hover:underline flex items-center justify-center gap-1.5 cursor-pointer"
              >
                <i class="fa-solid fa-arrow-left"></i> Back to Sign In
              </a>
            </div>
          </form>

          <div
            class="mt-10 bg-gray-50 rounded-lg p-4 flex gap-3 items-start border border-gray-100 shadow-sm"
          >
            <div class="bg-white p-2 rounded-full border border-gray-200 shadow-sm shrink-0">
              <i class="fa-regular fa-circle-question text-fontGray1 text-lg"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-gray-900 mb-0.5">Need assistance?</h4>
              <p class="text-2xs text-fontGray2 mb-1">
                Our digital concierge is available 24/7 for technical support.
              </p>
              <a routerLink="/home" class="text-2xs font-bold text-mainColorDark hover:underline"
                >Contact Support</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
