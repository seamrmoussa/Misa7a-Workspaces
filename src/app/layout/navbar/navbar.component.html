<nav
  class="bg-mainBg fixed w-full z-20 top-0 inset-s-0 border-b border-gray-200 transition-all duration-300"
>
  <div class="max-w-350 flex flex-wrap items-center justify-between mx-auto p-4">
    <app-main-logo></app-main-logo>

    <div class="flex items-center lg:order-2 space-x-4">
      <div class="hidden lg:flex items-center space-x-5 transition-all duration-300">
        <div class="relative">
          <div class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
          </div>
          <input
            type="text"
            class="block w-55 p-2 ps-10 text-sm text-gray-900 border-none bg-[#F1F3F5] rounded-full focus:ring-0 focus:outline-none transition-all duration-300"
            placeholder="Search spaces..."
          />
        </div>

        @if (notificationLoggedIn()) {
          <a
            [routerLink]="notificationBasePath()"
            routerLinkActive="text-mainColorLight"
            class="text-gray-600 hover:text-mainColorLight transition-all duration-300 focus:outline-none cursor-pointer"
            ariaCurrentWhenActive="page"
          >
            <i class="fa-regular fa-bell text-xl"></i>
          </a>
        }

        <a
          routerLink="/login"
          routerLinkActive="text-mainColorLight"
          class="text-gray-600 hover:text-mainColorLight transition-all duration-300 focus:outline-none cursor-pointer"
          ariaCurrentWhenActive="page"
        >
          <i class="fa-regular fa-circle-user text-xl"></i>
        </a>

        <app-main-button [link]="'/booking'" [text]="'Book Now'"></app-main-button>
      </div>

      <a
        data-collapse-toggle="navbar-sticky"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-all duration-300 cursor-pointer aria-expanded:text-mainColorLight"
        aria-controls="navbar-sticky"
        aria-expanded="false"
      >
        <span class="sr-only">Open main menu</span>
        <i class="fa-solid fa-bars text-xl"></i>
      </a>
    </div>

    <div
      class="items-center justify-between hidden w-full lg:flex lg:w-auto lg:order-1"
      id="navbar-sticky"
    >
      <ul
        class="font-medium flex flex-col p-4 lg:p-0 mt-4 border border-gray-100 rounded-lg bg-mainBg lg:flex-row lg:space-x-8 lg:mt-0 lg:border-0 lg:bg-transparent transition-all duration-300"
      >
        @for (path of paths(); track $index) {
          <li>
            <a
              [routerLink]="`/${path}`"
              [routerLinkActiveOptions]="{ exact: true }"
              routerLinkActive="text-mainColorLight lg:border-b-2 lg:!border-mainColorLight"
              class="block py-2 px-3 text-linksColor1 lg:p-0 transition-all duration-300 capitalize"
              ariaCurrentWhenActive="page"
              >{{ path }}</a
            >
          </li>
        }

        <li
          class="lg:hidden mt-4 pt-4 border-t border-gray-200 flex flex-col space-y-5 transition-all duration-300"
        >
          <div class="relative w-full">
            <div class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none">
              <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
            </div>
            <input
              type="text"
              class="block w-full p-2.5 ps-10 text-sm text-gray-900 border border-gray-300 bg-white rounded-lg focus:ring-mainColorLight focus:border-mainColorLight transition-all duration-300"
              placeholder="Search spaces..."
            />
          </div>

          <div class="flex items-center justify-around px-2 py-2">
            @if (notificationBasePath()) {
              <a
                [routerLink]="notificationBasePath()"
                routerLinkActive="text-mainColorLight"
                class="text-gray-600 hover:text-mainColorLight flex flex-col items-center space-y-2 transition-all duration-300 cursor-pointer"
                ariaCurrentWhenActive="page"
              >
                <i class="fa-regular fa-bell text-2xl"></i>
                <span class="text-xs font-medium">Notifications</span>
              </a>
            }
            <a
              routerLink="/login"
              routerLinkActive="text-mainColorLight"
              class="text-gray-600 hover:text-mainColorLight flex flex-col items-center space-y-2 transition-all duration-300 cursor-pointer"
              ariaCurrentWhenActive="page"
            >
              <i class="fa-regular fa-circle-user text-2xl"></i>
              <span class="text-xs font-medium">Profile</span>
            </a>
          </div>

          <app-main-button
            [fullWidth]="true"
            [link]="'/booking'"
            [text]="'Book Now'"
          ></app-main-button>
        </li>
      </ul>
    </div>
  </div>
</nav>
